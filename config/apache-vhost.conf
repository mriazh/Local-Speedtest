# Apache 2.4 VirtualHost Template for Local Speedtest
# Place in /etc/apache2/sites-available/speedtest.conf

<VirtualHost *:80>
    ServerName speedtest.yourdomain.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName speedtest.yourdomain.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/speedtest.yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/speedtest.yourdomain.com/privkey.pem

    # Production Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8989/
    ProxyPassReverse / http://127.0.0.1:8989/

    ErrorLog ${APACHE_LOG_DIR}/speedtest_error.log
    CustomLog ${APACHE_LOG_DIR}/speedtest_access.log combined
</VirtualHost>
