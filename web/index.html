<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Speedtest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="shell-header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <div class="brand-name">Local Speedtest</div>
        <div class="brand-desc">LAN speedtest &bull; Debian host</div>
      </div>
    </div>
  </header>

  <!-- Telemetry bar: Ping, Jitter, Download, Upload -->
  <div class="telemetry" id="telemetry" aria-label="Connection telemetry">
    <div class="tele-item" data-metric="ping">
      <div class="tele-dot ping"></div>
      <div class="tele-label">Ping</div>
      <div class="tele-value" id="tPing">--</div>
      <div class="tele-unit">ms</div>
    </div>
    <div class="tele-item" data-metric="jitter">
      <div class="tele-dot jitter"></div>
      <div class="tele-label">Jitter</div>
      <div class="tele-value" id="tJitter">--</div>
      <div class="tele-unit">ms</div>
    </div>
    <div class="tele-item" data-metric="download">
      <div class="tele-dot dl"></div>
      <div class="tele-label">Download</div>
      <div class="tele-value" id="tDl">--</div>
      <div class="tele-unit">Mbps</div>
    </div>
    <div class="tele-item" data-metric="upload">
      <div class="tele-dot ul"></div>
      <div class="tele-label">Upload</div>
      <div class="tele-value" id="tUl">--</div>
      <div class="tele-unit">Mbps</div>
    </div>
  </div>

  <!-- Centerpiece: single large speedometer gauge with GO button at its heart -->
  <div class="gauge-wrap" id="gaugeWrap" aria-label="Speedometer">
    <canvas id="gauge" width="720" height="400" role="img" aria-label="Speedometer gauge"></canvas>
    <div id="goBtn" class="go-btn" role="button" tabindex="0" aria-label="Start test" aria-pressed="false">GO</div>
    <div id="readout" class="readout hidden">
      <div class="readout-val" id="readoutVal">--</div>
      <div class="readout-unit" id="readoutUnit">Mbps</div>
      <div class="readout-sub" id="readoutSub">--</div>
    </div>
  </div>

  <div id="status" class="status">Idle</div>

  <!-- Local IP / Provider badge -->
  <div class="ip-badge" id="ipBadge" aria-label="Local IP">
    <span class="ip-dot"></span>
    <span id="ipVal">--</span>
    <span>• Local LAN</span>
  </div>

  <!-- Result card (shown on completion) -->
  <div class="result-card" id="resultCard" hidden>
    <div class="result-head">
      <h2>Test Complete</h2>
      <div class="result-badge">Results saved</div>
    </div>
    <div class="result-grid">
      <div class="result-item dl">
        <div class="result-val" id="rDl">--</div>
        <div class="result-unit">Mbps</div>
        <div class="result-lbl">Download</div>
      </div>
      <div class="result-item ul">
        <div class="result-val" id="rUl">--</div>
        <div class="result-unit">Mbps</div>
        <div class="result-lbl">Upload</div>
      </div>
      <div class="result-item ping">
        <div class="result-val" id="rPing">--</div>
        <div class="result-unit">ms</div>
        <div class="result-lbl">Ping</div>
      </div>
      <div class="result-item jitter">
        <div class="result-val" id="rJitter">--</div>
        <div class="result-unit">ms</div>
        <div class="result-lbl">Jitter</div>
      </div>
    </div>
    <div class="share">
      <label class="share-label">Shareable link</label>
      <div class="linkbox">
        <input id="shareLink" readonly placeholder="Link appears after test">
        <button id="copyBtn" type="button">Copy</button>
      </div>
      <a id="openResult" class="card-link" target="_blank" rel="noopener" hidden>View full card &rarr;</a>
    </div>
  </div>
</div>

<script src="speedtest.js"></script>
<script src="app.js"></script>
</body>
</html>
