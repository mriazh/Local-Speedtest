name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Create standalone tar.gz bundle
        run: |
          tar -czf local-speedtest-${{ github.ref_name }}.tar.gz \
            --exclude=.git \
            --exclude='.github' \
            config settings.toml scripts install.sh deploy.sh systemd web Dockerfile docker-compose.yml README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Multi-arch Docker images built and pushed to GHCR:
            - `ghcr.io/${{ github.repository }}:latest` (linux/amd64, linux/arm64)

            Standalone bundle attached below for offline install.
          files: local-speedtest-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
